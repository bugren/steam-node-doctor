[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-node-doctor"
dynamic = ["version"]
description = "Steam 网络节点诊断与修复：解决商店打不开、错误 -102/-118"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Steam Node Doctor contributors" }]
keywords = ["steam", "linux", "dns", "hosts", "network"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]

[project.scripts]
steam-node-doctor = "steam_node_doctor.cli:main"

[tool.setuptools.dynamic]
version = { attr = "steam_node_doctor.__version__" }

[tool.setuptools.packages.find]
include = ["steam_node_doctor*"]
