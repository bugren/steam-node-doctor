name: Bug 报告
description: 诊断结果不对、修复失败、或者程序报错
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先跑一次诊断并把输出贴上来，这能省掉一轮来回：

        ```bash
        steam-node-doctor diagnose --json
        ```
  - type: input
    id: os
    attributes:
      label: 系统与桌面
      description: 发行版版本 + 桌面环境（X11/Wayland）
      placeholder: Ubuntu 24.04 / XFCE / X11
    validations:
      required: true
  - type: textarea
    id: diagnose
    attributes:
      label: 诊断输出
      description: 粘贴 `steam-node-doctor diagnose --json` 的完整输出
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 我点了「一键修复」，期望商店能打开
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: 提示「所有候选节点都被拦截」，但手机热点下能打开
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: `steam-node-doctor --version` 的输出
      placeholder: Steam Node Doctor 0.1.0
    validations:
      required: false
